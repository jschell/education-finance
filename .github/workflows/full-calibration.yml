name: Full calibration evidence
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/**'
      - 'docs/full-calibration*'
      - '.github/workflows/full-calibration.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Preserve committed evidence
        run: |
          cp site/data/full-calibration.json /tmp/full-calibration-committed.json
          cp data/comparable-prices-through-2024.json /tmp/comparable-committed.json
          cp docs/full-calibration-results.md /tmp/full-calibration-committed.md
      - name: Evaluate frozen full-calibration protocol
        env:
          EMIT_RECOVERY_FILES: '1'
        run: node scripts/validate-full-calibration.mjs
      - name: Verify deterministic rebuild
        run: |
          cp site/data/full-calibration.json /tmp/full-calibration-first.json
          cp data/comparable-prices-through-2024.json /tmp/comparable-first.json
          cp docs/full-calibration-results.md /tmp/full-calibration-first.md
          node scripts/validate-full-calibration.mjs
          cmp site/data/full-calibration.json /tmp/full-calibration-first.json
          cmp data/comparable-prices-through-2024.json /tmp/comparable-first.json
          cmp docs/full-calibration-results.md /tmp/full-calibration-first.md
      - name: Verify committed evidence
        run: |
          cmp site/data/full-calibration.json /tmp/full-calibration-committed.json
          cmp data/comparable-prices-through-2024.json /tmp/comparable-committed.json
          cmp docs/full-calibration-results.md /tmp/full-calibration-committed.md
      - name: Repository checks
        run: npm run check
      - name: Begin immutable synthetic prospective record
        run: |
          node scripts/create-forecast-snapshot.mjs --as-of 2026-11-16 --output /tmp/prospective-cost.json
          if node scripts/create-forecast-snapshot.mjs --as-of 2026-11-16 --output /tmp/prospective-cost.json; then
            echo "Snapshot overwrite unexpectedly succeeded"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: full-calibration-evidence
          path: |
            site/data/full-calibration.json
            data/comparable-prices-through-2024.json
            docs/full-calibration-results.md
            /tmp/prospective-cost.json
