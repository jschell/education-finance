name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: Force all numerical reproductions
        type: boolean
        default: false
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm run check
      - name: Reproduce current foundation evidence
        run: |
          node scripts/build_foundation.mjs
          node scripts/validate-foundation.mjs
          git diff --exit-code -- site/data/calibration-foundation.json site/data/foundation-validation.json
      - name: Reproduce practical planning evidence
        run: |
          node scripts/validate-planning.mjs
          git diff --exit-code -- site/data/planning-validation.json
      - name: Reproduce coherent cost evaluation
        run: |
          node scripts/validate-hierarchy.mjs
          git diff --exit-code -- site/data/hierarchy-validation.json
      - name: Reproduce current school and funding calibration
        run: |
          node scripts/validate-current-calibration.mjs
          git diff --exit-code --stat -- site/data/current-calibration.json data/calibration-cases/
      - name: Verify current prospective record
        run: node scripts/verify-current-snapshot.mjs
      - name: Reproduce descriptive school-error audit
        run: |
          node scripts/audit-calibration-dispersion.mjs
          git diff --exit-code -- data/calibration-diagnostics/dispersion.json
      - name: Reproduce source-quality and school-persistence audit
        run: |
          python3 -m venv /tmp/education-finance-dictionary-qa
          /tmp/education-finance-dictionary-qa/bin/pip install openpyxl==3.1.5 xlrd==2.0.2
          /tmp/education-finance-dictionary-qa/bin/python scripts/prepare_ipeds_dictionaries.py
          node scripts/audit-calibration-quality-persistence.mjs
          git diff --exit-code -- data/ipeds-price-dictionaries.json data/calibration-diagnostics/quality-persistence.json
      - name: Reproduce decision-boundary evidence
        run: |
          node scripts/validate-decision-boundaries.mjs
          git diff --exit-code --stat -- site/data/decision-validation.json data/decision-cases/
      - name: Reproduce bounded price-source trace offline
        run: |
          python3 -m unittest discover -s tests -p price_trace_extract_test.py
          node scripts/select-price-traces.mjs
          node scripts/compare-price-traces.mjs
          git diff --exit-code -- data/calibration-diagnostics/price-trace-registry.json data/calibration-diagnostics/price-trace-comparison.json
      - name: Reproduce revision-aware price-panel research audit
        run: |
          python3 -m unittest discover -s tests -p price_panel_extract_test.py
          node scripts/audit_revision_price_panel.mjs
          git diff --exit-code -- data/calibration-diagnostics/revision-price-panel.json
      - name: Verify synthetic revision-cost process evidence
        run: node scripts/validate-revision-cost-process.mjs --verify
      - name: Reproduce matched observation-graph support
        run: node --max-old-space-size=4096 scripts/audit-observation-graphs.mjs --verify
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify bounded estimator mathematics
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python3 -m venv /tmp/education-finance-estimator-qa
          /tmp/education-finance-estimator-qa/bin/pip install numpy==2.3.5 scipy==1.17.0
          /tmp/education-finance-estimator-qa/bin/python -m unittest discover -s tests -p revision_estimator_test.py
      - name: Identify estimator reproduction inputs
        id: estimator-key
        run: echo "key=$(/tmp/education-finance-estimator-qa/bin/python scripts/reproduction-stamp.py estimator)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: estimator-cache
        with:
          path: .cache/reproductions/estimator
          key: estimator-${{ runner.os }}-${{ runner.arch }}-${{ steps.estimator-key.outputs.key }}
      - name: Reproduce estimator recovery
        if: steps.estimator-cache.outputs.cache-hit != 'true' || inputs.force_full == true
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          /tmp/education-finance-estimator-qa/bin/python scripts/validate_revision_estimator.py --verify
          /tmp/education-finance-estimator-qa/bin/python scripts/reproduction-stamp.py estimator --write
      - name: Verify estimator completion marker
        run: /tmp/education-finance-estimator-qa/bin/python scripts/reproduction-stamp.py estimator --check
      - uses: actions/cache/save@v4
        if: steps.estimator-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/reproductions/estimator
          key: estimator-${{ runner.os }}-${{ runner.arch }}-${{ steps.estimator-key.outputs.key }}
      - name: Install isolated browser QA
        run: |
          npm install --prefix /tmp/education-finance-qa playwright
          /tmp/education-finance-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser checks at project prefix
        run: |
          mkdir -p /tmp/education-finance-qa-root
          ln -s "$GITHUB_WORKSPACE/site" /tmp/education-finance-qa-root/education-finance
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/education-finance-qa-root >/tmp/education-finance-http.log 2>&1 &
          node scripts/browser-cost-followup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overhaul-browser-evidence
          path: tests/evidence/followup/

  reml-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated pinned numerical dependencies
        run: |
          python3 -m venv /tmp/education-finance-reml-qa
          /tmp/education-finance-reml-qa/bin/pip install numpy==2.3.5 scipy==1.17.0
      - name: Verify REML mathematics, profiles and numerical reproduction
        run: |
          /tmp/education-finance-reml-qa/bin/python -m unittest discover -s tests -p reml_study_test.py
          /tmp/education-finance-reml-qa/bin/python -m unittest discover -s tests -p reml_profile_test.py
          /tmp/education-finance-reml-qa/bin/python -m unittest discover -s tests -p reml_reproduction_test.py
      - name: Identify REML reproduction inputs
        id: reml-key
        run: echo "key=$(/tmp/education-finance-reml-qa/bin/python scripts/reproduction-stamp.py reml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: reml-cache
        with:
          path: .cache/reproductions/reml
          key: reml-${{ runner.os }}-${{ runner.arch }}-${{ steps.reml-key.outputs.key }}
      - name: Reproduce REML study
        if: steps.reml-cache.outputs.cache-hit != 'true' || inputs.force_full == true
        run: |
          /tmp/education-finance-reml-qa/bin/python scripts/verify_reml_reproduction.py
          /tmp/education-finance-reml-qa/bin/python scripts/reproduction-stamp.py reml --write
      - name: Verify REML completion marker
        run: /tmp/education-finance-reml-qa/bin/python scripts/reproduction-stamp.py reml --check
      - uses: actions/cache/save@v4
        if: steps.reml-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/reproductions/reml
          key: reml-${{ runner.os }}-${{ runner.arch }}-${{ steps.reml-key.outputs.key }}

  predictive-study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Install isolated numerical dependencies
        run: |
          python3 -m venv /tmp/education-finance-predictive-qa
          /tmp/education-finance-predictive-qa/bin/pip install numpy==2.3.5 scipy==1.17.0
      - name: Verify predictive mathematics and artifact contracts
        run: |
          /tmp/education-finance-predictive-qa/bin/python -m unittest discover -s tests -p predictive_study_test.py
          /tmp/education-finance-predictive-qa/bin/python -m unittest discover -s tests -p predictive_reproduction_test.py
          /tmp/education-finance-predictive-qa/bin/python -m unittest discover -s tests -p predictive_portability_test.py
          /tmp/education-finance-predictive-qa/bin/python -m unittest discover -s tests -p predictive_runtime_test.py
          /tmp/education-finance-predictive-qa/bin/python -m unittest discover -s tests -p reproduction_stamp_test.py
          /tmp/education-finance-predictive-qa/bin/python scripts/validate_predictive_depth.py --validate
          /tmp/education-finance-predictive-qa/bin/python scripts/verify_predictive_runtime.py --validate
          /tmp/education-finance-predictive-qa/bin/python scripts/summarize_predictive_depth.py --verify
          node --test tests/predictive-ledger.test.js tests/metadata-continuity.test.js
          node --max-old-space-size=4096 scripts/audit-metadata-continuity.mjs --verify
      - name: Identify predictive reproduction inputs
        id: predictive-key
        run: echo "key=$(/tmp/education-finance-predictive-qa/bin/python scripts/reproduction-stamp.py predictive)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: predictive-cache
        with:
          path: .cache/reproductions/predictive
          key: predictive-${{ runner.os }}-${{ runner.arch }}-${{ steps.predictive-key.outputs.key }}
      - name: Reproduce supported AVX2 arm; retain failed primary cross-runtime gate
        if: steps.predictive-cache.outputs.cache-hit != 'true' || inputs.force_full == true
        run: |
          /tmp/education-finance-predictive-qa/bin/python scripts/verify_predictive_runtime.py --workers 2
          /tmp/education-finance-predictive-qa/bin/python scripts/reproduction-stamp.py predictive --write
      - name: Verify predictive completion marker
        run: /tmp/education-finance-predictive-qa/bin/python scripts/reproduction-stamp.py predictive --check
      - uses: actions/cache/save@v4
        if: steps.predictive-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/reproductions/predictive
          key: predictive-${{ runner.os }}-${{ runner.arch }}-${{ steps.predictive-key.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: predictive-runtime-diagnostic
          path: .cache/predictive-reproduction/
