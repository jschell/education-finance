name: Separable study
on:
  push:
    branches: [separable-cost-study]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: separable-study-${{ github.ref }}
  cancel-in-progress: true
jobs:
  separable-study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Verify mathematics, joint uncertainty and failure guards
        run: python -m unittest discover -s tests -p 'separable*test.py'
      - name: Independently refit and rescore all 960 frozen cells
        run: python scripts/run_separable_cost_study.py --verify
      - name: Verify application remains unchanged
        run: npm run check
